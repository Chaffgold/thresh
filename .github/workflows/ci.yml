name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * 1'   # Weekly Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      # Track B training-data export (Rust-native Parquet) is feature-gated to
      # keep arrow/parquet out of default builds; exercise it explicitly.
      - run: cargo test -p thresh --features training-export

  doc:
    name: Doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -Dwarnings

  openspec:
    name: OpenSpec Validate
    runs-on: ubuntu-latest
    env:
      OPENSPEC_VERSION: '1.13.2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned OpenSpec
        run: npm install -g "@fission-ai/openspec@${OPENSPEC_VERSION}"
        env:
          OPENSPEC_TELEMETRY: '0'
      - name: Verify OpenSpec version
        shell: bash
        run: |
          installed_version="$(openspec --version)"
          echo "OpenSpec ${installed_version} (expected ${OPENSPEC_VERSION})"
          test "$installed_version" = "$OPENSPEC_VERSION"
      - run: openspec validate --all --strict --no-interactive
        env:
          OPENSPEC_TELEMETRY: '0'
      # --all does not include archived-task validation; keep this separate.
      - run: openspec validate --archived --strict --no-interactive
        env:
          OPENSPEC_TELEMETRY: '0'
      # Document validation alone does not reject missing schema metadata.
      - name: Validate active change metadata
        shell: bash
        run: |
          for change in openspec/changes/*; do
            if [[ -d "$change" && "${change##*/}" != archive ]]; then
              openspec status --change "${change##*/}"
            fi
          done
        env:
          OPENSPEC_TELEMETRY: '0'

  synth-benchmark-gate:
    # Runs every synthetic and ballistic benchmark scenario through
    # `thresh-data run` and fails the build if any scenario's regression
    # check (MOTA / HOTA / IDF1 baselines) does not pass. This is the cheap
    # in-repo equivalent of the full benchmarks workflow — no network, no
    # long-running integration tests, just the baseline regression gate for
    # the scenarios checked into `crates/thresh-data/scenarios/`. Ballistic
    # scenarios ride in this job because their phased truth generation is
    # pure Rust and runs under default features, exactly like the synthetic
    # ones (orbital-ballistic-filter-models, task 6.3).
    name: Synthetic benchmark gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build thresh-data CLI
        run: cargo build -p thresh-data --bin thresh-data
      - name: Run all synthetic and ballistic scenarios
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          any=0
          for toml in crates/thresh-data/scenarios/synth-*.toml \
                      crates/thresh-data/scenarios/ballistic-*.toml; do
            any=1
            echo "=== $toml ==="
            ./target/debug/thresh-data run "$toml"
          done
          if [ "$any" -eq 0 ]; then
            echo "no synth-*.toml / ballistic-*.toml scenarios found under crates/thresh-data/scenarios/" >&2
            exit 1
          fi

  orbital-benchmark-gate:
    # Same regression gate pattern as synth-benchmark-gate, but for orbital
    # scenarios that need the `orbital` feature (sgp4 + reqwest). All
    # orbital-*.toml scenarios in the repo use cached TLE files so this
    # job still runs without network access; the HTTP fallback path in
    # `run_orbital_benchmark` is exercised by the `--ignored` integration
    # tests under `crates/thresh-data/tests/`.
    name: Orbital benchmark gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build thresh-data CLI with orbital feature
        run: cargo build -p thresh-data --features orbital --bin thresh-data
      - name: Run all orbital scenarios
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          any=0
          for toml in crates/thresh-data/scenarios/orbital-*.toml; do
            any=1
            echo "=== $toml ==="
            ./target/debug/thresh-data run "$toml"
          done
          if [ "$any" -eq 0 ]; then
            echo "no orbital-*.toml scenarios found under crates/thresh-data/scenarios/" >&2
            exit 1
          fi

  stonesoup-boundary:
    # Required on every PR, including PRs to develop; never path-filter this lane.
    # Boundary success does not certify the separate algorithm-wrapper repairs.
    name: Stone Soup boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - uses: Swatinem/rust-cache@v2
        with:
          key: stonesoup-boundary-python-3.12.13
      - name: Install isolated, hash-locked boundary dependencies
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/thresh-bridge-python"
          "$RUNNER_TEMP/thresh-bridge-python/bin/python" -m pip install --require-hashes -r crates/thresh-bridge/tests/requirements.txt
          echo "PYO3_PYTHON=$RUNNER_TEMP/thresh-bridge-python/bin/python" >> "$GITHUB_ENV"
      - name: Verify boundary runner failure modes
        run: '"$PYO3_PYTHON" -m unittest discover -s crates/thresh-bridge/tests -p test_runner.py -v'
      - name: Execute every manifest boundary test
        # Runner verifies versions and sets child PYTHONPATH for embedding only.
        # It rejects missing packages, ignored tests, missing names and zero tests.
        run: '"$PYO3_PYTHON" crates/thresh-bridge/tests/run_boundary_tests.py'
      - name: Execute feature-enabled bridge documentation examples
        shell: bash
        run: |
          PYTHONPATH="$("$PYO3_PYTHON" -c 'import os, site; print(os.pathsep.join(site.getsitepackages()))')"
          export PYTHONPATH
          bridge_library_path="$("$PYO3_PYTHON" -c '
          import os, runpy
          environment = os.environ.copy()
          runner = runpy.run_path("crates/thresh-bridge/tests/run_boundary_tests.py")
          runner["configure_shared_library"](environment)
          print(environment.get("LD_LIBRARY_PATH", ""))
          ')"
          if [ -n "$bridge_library_path" ]; then
            export LD_LIBRARY_PATH="$bridge_library_path"
          fi
          cargo test --locked -p thresh-bridge --no-default-features --features stonesoup --doc

  native-no-python:
    name: Native workspace without Python
    runs-on: ubuntu-latest
    env:
      PYO3_NO_PYTHON: '1'
      PYO3_PYTHON: /__thresh_python_discovery_disabled__
      PYTHON_SYS_EXECUTABLE: /__thresh_python_discovery_disabled__
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-no-python
      - name: Reject Python dependencies in the native workspace
        shell: bash
        run: |
          dependency_tree="$(cargo tree --color never --locked --workspace --exclude thresh-py --no-default-features --prefix none)"
          native_grep_status=0
          grep -Eq '^pyo3([ -]|$)' <<< "$dependency_tree" || native_grep_status=$?
          case "$native_grep_status" in
            0)
              echo 'Native dependency tree unexpectedly contains PyO3' >&2
              exit 1
              ;;
            1) ;;
            *)
              echo "Native dependency check failed (grep exit $native_grep_status)" >&2
              exit "$native_grep_status"
              ;;
          esac
      - name: Build native workspace with Python discovery disabled
        run: cargo build --locked --workspace --exclude thresh-py --no-default-features
      - name: Test native workspace with Python discovery disabled
        run: cargo test --locked --workspace --exclude thresh-py --no-default-features

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Create virtualenv and install Python deps
        run: |
          python -m venv "$VIRTUAL_ENV"
          "$VIRTUAL_ENV/bin/pip" install --upgrade pip
          "$VIRTUAL_ENV/bin/pip" install maturin pytest numpy
      - name: Build and install thresh-py
        run: |
          export PATH="$VIRTUAL_ENV/bin:$PATH"
          cd crates/thresh-py && maturin develop
      - name: Run pytest
        run: |
          export PATH="$VIRTUAL_ENV/bin:$PATH"
          pytest tests/python/ -v

  python-training-tree:
    # Lint + type-check + smoke-test the python/ training tree
    # (separate from crates/thresh-py, which is a maturin-built binding).
    # Installs only the `dev` dependency group via uv; the heavier
    # `training` optional deps (torch, onnx, onnxruntime) are pulled in
    # by the training and export scripts in Phases 6–7, not here.
    name: Python training tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: 'latest'
      - name: Sync dev deps
        working-directory: python
        run: uv sync --no-default-groups --group dev
      - name: ruff check
        working-directory: python
        run: uv run --no-default-groups --group dev ruff check .
      - name: pyright
        working-directory: python
        run: uv run --no-default-groups --group dev pyright
      - name: pytest
        working-directory: python
        run: uv run --no-default-groups --group dev pytest -q

  adsb-benchmark-gate:
    # Same regression gate pattern as synth-benchmark-gate / orbital-benchmark-gate,
    # but for ADS-B scenarios that need the `adsb` feature (reqwest + csv).
    # All adsb-*.toml scenarios in the repo reference cached JSON state-vector
    # fixtures so this job runs offline. The live-OpenSky fallback path in
    # `run_adsb_benchmark` is exercised by the `--ignored` integration tests
    # under `crates/thresh-data/tests/`.
    name: ADS-B benchmark gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build thresh-data CLI with adsb feature
        run: cargo build -p thresh-data --features adsb --bin thresh-data
      - name: Run all ADS-B scenarios
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          any=0
          for toml in crates/thresh-data/scenarios/adsb-*.toml; do
            any=1
            echo "=== $toml ==="
            ./target/debug/thresh-data run "$toml"
          done
          if [ "$any" -eq 0 ]; then
            echo "no adsb-*.toml scenarios found under crates/thresh-data/scenarios/" >&2
            exit 1
          fi

  viz-build:
    # Cross-platform GUI build smoke test. egui/eframe pull in
    # platform-specific windowing crates (winit, wayland-client on
    # Linux, AppKit on macOS, win32 on Windows) that can break in
    # ways the default Linux CI doesn't catch. We verify the build
    # graph compiles on all three OSes; no headless GUI run is
    # attempted — the build itself is the smoke test.
    #
    # `fail-fast: false` so a Windows or macOS hiccup doesn't mask
    # results from the other platforms.
    name: viz-build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev \
            libwayland-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev
      - name: Build thresh-viz with gui feature
        run: cargo build -p thresh-viz --features gui

  changes:
    # PR-only path filter: detect whether this PR touches the ONNX
    # inference code path so the (slow, uncached) ONNX job below can
    # be skipped on PRs that don't need it.
    name: Detect changed paths
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      inference: ${{ steps.filter.outputs.inference }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            inference:
              - 'crates/thresh-inference/**'
              - 'crates/thresh-filter/**'
              - 'crates/thresh-tracker/**'
              - 'crates/thresh/**'
              - 'test-data/models/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'

  onnx-tests:
    # ONNX inference tests require ORT binaries which the ort crate
    # auto-downloads during build. ORT download is slow and not cached
    # by rust-cache, so we skip this job on PRs that don't touch
    # inference-relevant paths. Always runs on schedule (weekly) and
    # workflow_dispatch.
    name: ONNX inference tests
    runs-on: ubuntu-latest
    needs: changes
    if: |
      always() && (
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' && needs.changes.outputs.inference == 'true')
      )
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install ONNX Runtime
        run: |
          # ort crate auto-downloads ORT binaries on first build
          echo "ORT will be fetched by the ort crate during build"
      - name: Run inference tests
        run: cargo test -p thresh-inference --features onnx
      - name: Run learned-IMM tests (Track B classifier + ONNX stub contract)
        run: cargo test -p thresh-filter --features learned-imm
      - name: Run learned-IMM tracker seam tests
        run: cargo test -p thresh-tracker --features learned-imm
      - name: Test detector evaluation and learned-IMM modes (synthetic and stub models)
        run: cargo test -p thresh --features onnx,learned-imm --lib --test eval_tracker_cli
      - name: Set up Python (ONNX parity check)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: 'latest'
      - name: ONNX cross-language parity (Python onnxruntime vs Rust ort)
        working-directory: python
        run: uv run --extra training --group dev pytest tests/test_onnx_parity.py -q
