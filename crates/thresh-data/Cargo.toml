[package]
name = "thresh-data"
description = "Test data pipeline and dataset adapters for thresh"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
adsb = ["reqwest", "csv"]
orbital = ["sgp4", "reqwest"]
nuscenes = ["pyo3"]

[dependencies]
thresh-core = { path = "../thresh-core" }
thresh-synth = { path = "../thresh-synth" }
thresh-tracker = { path = "../thresh-tracker" }
thresh-eval = { path = "../thresh-eval" }
nalgebra = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
rand = "0.9"
rand_distr = "0.5"
reqwest = { workspace = true, optional = true }
csv = { workspace = true, optional = true }
sgp4 = { workspace = true, optional = true }
# auto-initialize: thresh-data is consumed by EMBEDDING binaries (eval-nuscenes),
# which must start the interpreter themselves — unlike thresh-py (an extension
# module, where Python is already running).
pyo3 = { version = "0.29", optional = true, features = ["auto-initialize"] }

# Benchmark scenario runner CLI. Always built (no feature gate) since the
# synthetic scenario path only needs types from thresh-core / thresh-synth /
# thresh-tracker that are already in the default build graph.
[[bin]]
name = "thresh-data"
path = "src/bin/thresh_data.rs"

# SGP4 golden-fixture generator (tier 3, orbital-ballistic-filter-models
# Decision 8). Run manually to (re)generate test-data/golden/orbital/;
# the committed output is what CI reads — this binary never runs in CI.
[[bin]]
name = "gen-sgp4-fixtures"
path = "src/bin/gen_sgp4_fixtures.rs"
required-features = ["orbital"]

[dev-dependencies]
tempfile = "3"
# Hosts the tier-3 golden envelope test (tests/golden_orbital.rs), which
# runs KeplerJ2 against the committed SGP4 fixtures under default features.
# thresh-filter is already in this crate's dependency graph (thresh-data ->
# thresh-tracker -> thresh-filter), so this dev edge follows the existing
# dependency direction and adds no new compilation unit; see the test file
# header for why the test lives here.
thresh-filter = { path = "../thresh-filter" }
