name = "adsb-single-flight"
description = "Single synthetic ADS-B flight descending into JFK. Uses a cached state-vector fixture so the scenario runs offline in the CI benchmark gate and is deterministic across runs."

[source.AdsB]
region = "JFK"
state_file = "adsb-single-flight.json"
ref_lat_deg = 40.6413
ref_lon_deg = -73.7781
ref_alt_m = 0.0

[parameters]
# One sample per second over the ~60 s approach in the fixture.
duration_s = 60.0
dt = 1.0
measurement_noise_sigma = 50.0
# Generous gate — ADS-B altitude noise is larger than the horizontal
# component, and the tracker operates in metres so the threshold is in
# squared-Mahalanobis units.
gate_threshold = 500.0

[baselines]
# No MOTA floor (task 6.6 of `orbital-ballistic-filter-models` removed
# the negative smoke-value convention from every scenario). Measured
# MOTA on this fixture is -0.2333 (three consecutive runs, deterministic
# and bitwise-identical; platform: macos-local, 2026-07-12): the ~60 s
# approach is shorter than the CV tracker's confirmation lag can amortise,
# so false negatives dominate and no honest floor above 0 exists. A
# calibrated floor of observed - margin would just be a new negative
# smoke value, so the accuracy gate is intentionally absent until the
# ADS-B tracking path is good enough to clear 0.0. Pipeline breakage
# (fixture parse, WGS84→ENU transform, ground-truth extraction, tracker
# wiring) still fails CI through the runner's error path, which exits
# non-zero before the regression check is reached.
