name = "adsb-tracon"
description = "Synthetic 4-aircraft TRACON approach to JFK from NE / SE / NW / SW. Exercises the multi-target ADS-B pipeline: state-vector ingestion, WGS84→ENU, ground-truth extraction, and tracker data-association across overlapping descents. Deterministic fixture so the CI gate is reproducible and runs offline."

[source.AdsB]
region = "JFK-TRACON"
state_file = "adsb-tracon.json"
ref_lat_deg = 40.6413
ref_lon_deg = -73.7781
ref_alt_m = 0.0

[parameters]
duration_s = 90.0
dt = 1.0
measurement_noise_sigma = 50.0
gate_threshold = 500.0

[baselines]
# No MOTA floor — same rationale as adsb-single-flight.toml (task 6.6 of
# `orbital-ballistic-filter-models`: no negative smoke values anywhere).
# Measured MOTA on this fixture is -0.9556 (three consecutive runs,
# deterministic and bitwise-identical; platform: macos-local, 2026-07-12):
# the 90 s window is dominated by confirmation-lag false negatives across
# the 4 simultaneous descents, so no honest floor above 0 exists yet.
# The association path this scenario exists to exercise still fails CI
# through the runner's error path on catastrophic breakage.
