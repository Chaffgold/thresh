name = "ballistic-mrbm"
description = "Single MRBM-class ballistic target (phased boost/midcourse/reentry truth over a round rotating Earth) observed by a downrange radar at 1 s sampling with seeded noise. Exercises the full Decision-7 pipeline: BallisticProfile truth -> station ENU -> radar RAE -> ECI detections -> 7D BallisticReentry EKF head -> MOT metrics. Pure Rust truth generation, so this scenario runs offline under default features in the CI benchmark gate."

[source.Ballistic]
# Equatorial due-north launch (decoupled from the eastward Earth-rotation
# velocity so the profile numbers stay interpretable). beta = 2000 kg/m^2
# per task 6.3. Measured flight shape at dt = 1 s: burnout ~65 s,
# apogee 231 km, flight 527 s, ground range ~1073 km, impact 72 km from
# the station. Task 6.3's sketch said "~300 s flight, ~1000 km range";
# a 1000 km trajectory with a real exo-atmospheric midcourse physically
# flies ~530 s — hitting 300 s at that range requires a fully depressed
# shot (apogee < 90 km) that never leaves the atmosphere, which would
# defeat the midcourse/reentry phase coverage this benchmark exists to
# gate. The ~1000 km range constraint was kept; the flight time follows
# from the physics.
launch_lat_deg = 0.0
launch_lon_deg = 0.0
launch_alt_m = 0.0
launch_azimuth_deg = 0.0
thrust_accel_m_s2 = 52.0
burn_time_s = 65.0
pitch_over_s = 10.0
pitch_kick_deg = 38.0
beta_kg_m2 = 2000.0
epoch_jd = 2451545.0
# Downrange radar station ~1000 km north of the pad (9 deg of latitude),
# near the impact point (72 km away) so the reentry is observed to the
# ground.
#
# Visibility window (task 6.3 open question, settled from the first truth
# runs): the target rises above the station's horizon at t = 69 s (upper
# boost, ~80 km altitude at ~1000 km ground distance) and stays visible
# continuously through reentry and impact at t = 527 s. The window is
# therefore midcourse + reentry, NOT reentry-only: the benchmark exercises
# the beta-unobservable exo-atmospheric stretch (covariance honesty, beta
# random-walk re-inflation) and the beta-observable high-drag reentry in
# one pass. Same conclusion recorded in the design doc's Open Questions.
station_lat_deg = 9.0
station_lon_deg = 0.0
station_alt_m = 0.0

[parameters]
# 1 s sampling per task 6.3; duration covers the whole 527 s flight (the
# runner stops at the truth's surface-impact sample if that comes first).
duration_s = 600.0
dt = 1.0
# Radar noise: range sigma 100 m; angle sigma = 100 / 50000 = 2 mrad
# (the orbital runner's convention), i.e. ~1 km cross-range at the median
# visible slant range. The tracker's R uses that effective combined sigma
# (~1 km for this geometry — printed per run as "effective measurement
# sigma").
measurement_noise_sigma = 100.0
# Mahalanobis gate on the 3D position innovation: chi-squared 3-DoF
# 0.9999 quantile ~= 21, roughly doubled for the range-dependent RAE
# noise that the fixed R linearises at the median slant range.
gate_threshold = 50.0

[baselines]
# Calibrated per design Decision 7 (task 6.5): observed MOTA 0.9978 on
# three consecutive runs (deterministic, bitwise-identical; platform:
# macos-local, 2026-07-12; MOTP 398 m, IDF1 0.999, 0 ID switches across
# 459 ground-truth points). Floor = 0.9978 - 0.15 margin for
# cross-platform float-drift-induced association flips; cross-platform
# confirmation comes from this PR's CI runs (adjust if ubuntu/windows
# observe lower).
# Informal comparison against the CV head (`scenario_type =
# "force-cv-head"`, same pipeline): MOTA -0.14 with 62 ID switches — the
# 7D reentry head's floor is not a mediocre-number lock-in.
mota = 0.84
