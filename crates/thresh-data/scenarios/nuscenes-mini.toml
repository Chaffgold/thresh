name = "nuscenes-mini"
description = "Single-scene nuScenes mini-split benchmark. Exercises the nuScenes PyO3 bridge, the Dataset-trait adapter, the 3-D annotation → ground-truth extraction, and the tracker's multi-target association on real autonomous-driving data. Requires `--features nuscenes` plus a local nuScenes v1.0-mini download; dataroot is read from the NUSCENES_DATA_ROOT environment variable so the manifest stays portable across developer machines."

[source.NuScenes]
version = "v1.0-mini"
# `dataroot` and `scene_token` are intentionally omitted — `dataroot`
# comes from NUSCENES_DATA_ROOT and the runner picks the first scene in
# the split by default.

[parameters]
# nuScenes keyframes are ~0.5 s apart; the runner uses the actual
# inter-sample delta rather than this field, but we still set it as a
# reasonable fallback for the very first step.
duration_s = 20.0
dt = 0.5
# Annotation centroids are in metres in the global frame, so noise sigma
# is also in metres.
measurement_noise_sigma = 1.0
gate_threshold = 50.0

[baselines]
# No MOTA floor (task 6.6 of `orbital-ballistic-filter-models` removed
# the negative smoke-value convention from every scenario). This scenario
# cannot run in CI at all — it needs `--features nuscenes` (PyO3), a
# Python env with `nuscenes-devkit`, and a local ~4 GB v1.0-mini download
# — so a floor here would gate nothing while a negative placeholder
# would contradict the calibrated-floor convention the orbital/ballistic
# scenarios now follow. When a machine with the dataset runs this
# scenario (a past local run of the automotive-tracking work measured
# MOTA 0.93 on the mini split), a calibrated floor can be added with the
# Decision-7 procedure: observed_min - 0.15, values and platform recorded
# here. Bridge/extraction breakage still surfaces through the runner's
# error path for anyone running the scenario locally.
