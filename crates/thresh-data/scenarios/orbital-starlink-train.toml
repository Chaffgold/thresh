name = "orbital-starlink-train"
description = "Synthetic 5-satellite train tracked from a mid-latitude ground station. Multi-target orbital pipeline regression — exercises SGP4 propagation, ENU -> ECI lifting, and the tracker's data-association path across overlapping Kepler+J2 tracks. TLEs are hand-crafted clones of the cached ISS orbit regime (same inclination, RAAN, and epoch) with staggered mean anomalies so the constellation definitely passes over the station the orbital-iss scenario already uses; no real Starlink telemetry is required, and the scenario runs fully offline in the CI benchmark gate."

[source.Orbital]
norad_ids = [90001, 90002, 90003, 90004, 90005]
tle_file = "orbital-starlink-train.tle"
station_lat_deg = 38.8339
station_lon_deg = -104.8214
station_alt_m = 1885.0

[parameters]
# Same 3-hour window as orbital-iss so the scenarios can share a CI
# runtime budget. 5 satellites at the same inclination with staggered mean
# anomalies (2.5 deg apart, ~300 km along-track spacing) means the pass
# windows overlap, which is what exercises the association path.
duration_s = 10800.0
dt = 5.0
# Same RAE noise model and rationale as orbital-iss.toml: 100 m range,
# 2 mrad angles, effective Cartesian sigma ~3.1 km at this scenario's
# median slant range.
measurement_noise_sigma = 100.0
# Mahalanobis-consistent gate — see orbital-iss.toml for the derivation.
gate_threshold = 50.0

[baselines]
# Real accuracy floor (task 6.5, design Decision 7 calibration procedure):
# observed MOTA 0.9248 on three consecutive runs (deterministic,
# bitwise-identical; platform: macos-local, 2026-07-12; MOTP 1602 m,
# IDF1 0.962, 0 ID switches across 572 ground-truth points). Floor =
# observed_min - 0.15; cross-platform confirmation comes from this PR's
# CI runs (adjust if ubuntu/windows observe lower). The old baseline was
# the -5.0 pipeline-smoke placeholder with the CV-in-ENU tracker.
mota = 0.77
