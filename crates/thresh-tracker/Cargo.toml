[package]
name = "thresh-tracker"
description = "Track management, lifecycle, and class-specific tracking heads"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.docs.rs]
features = ["streaming"]

[features]
parallel = ["rayon"]
streaming = ["tokio"]
# Learned-IMM tracker path: each track's IMM bank is wrapped by thresh-filter's
# `LearnedImmFilter` (ONNX mode classifier). Pulls the heavy ort/ONNX stack via
# thresh-filter, so it is opt-in and kept out of default/CI builds.
learned-imm = ["thresh-filter/learned-imm"]

[dependencies]
thresh-core = { path = "../thresh-core" }
thresh-filter = { path = "../thresh-filter" }
thresh-association = { path = "../thresh-association" }
thresh-fusion = { path = "../thresh-fusion" }
nalgebra = { workspace = true }
serde = { workspace = true }
rayon = { version = "1.10", optional = true }
tokio = { version = "1", features = ["sync", "time", "rt"], optional = true }

[dev-dependencies]
thresh-synth = { path = "../thresh-synth" }
thresh-eval = { path = "../thresh-eval" }
criterion = { workspace = true }
nalgebra = { workspace = true }
rand = "0.9"
rand_distr = "0.5"
serde_json = { workspace = true }
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }

[[bench]]
name = "tracker_step"
harness = false
